
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Basket handle -->
  <path d="M 22 28 C 22 17, 42 17, 42 28" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Basket body -->
  <path d="M 14 27 L 50 27 L 44 49 C 43.5 51.5, 41.5 53, 39 53 L 25 53 C 22.5 53, 20.5 51.5, 20 49 Z" fill="#ffffff" />

  <!-- Price trend line (replaces woven ribs) -->
  <polyline points="21,47 27,41 32,44 41,34" fill="none" stroke="#166534" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="35.5,33.5 41.5,33.5 41.5,39.5" fill="none" stroke="#166534" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="21" cy="47" r="1.6" fill="#d97706" />
  <circle cx="27" cy="41" r="1.6" fill="#d97706" />
  <circle cx="32" cy="44" r="1.6" fill="#d97706" />

  <!-- Taka price badge -->
  <circle cx="48" cy="16" r="10.5" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
  <text x="48" y="21" font-family="'Noto Sans Bengali','Hind Siliguri','Kalpurush',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">৳</text>
</svg>
